<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Easy Floorplan · Furniture actions #323</title>
<style>
  :root { font: 15px system-ui; color: #243d4c; background: #eef3f5; }
  body { max-width: 1120px; margin: 28px auto; padding: 0 24px; }
  h1 { margin-bottom: 8px; font-size: 28px; } p { color: #496574; line-height:1.6; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
  section { background: white; border-radius: 16px; padding: 20px; }
  h2 { font-size: 18px; margin: 0 0 12px; } #stage { color: #087c88; }
  output { display: block; margin-top: 18px; font-weight: 600; min-height: 48px; line-height:1.6; }
  button, select { padding: 8px 14px; border:1px solid #9bb2bd; border-radius:6px; background:white; color:inherit; }
  label { margin-left:16px; } .legend { padding:12px 16px; background:#dcece9; border-radius:8px; }
  easy-floorplan-card { display: block; --primary-text-color: #243d4c; --card-background-color: #fff; --primary-color:#087c88; }
  @media(max-width:700px) { main { grid-template-columns:1fr; } }
</style>
<h1>Furniture surfaces and action icons <span id="stage"></span></h1>
<p class="legend">Tap a furniture surface to focus its room. Use its visible icon to run an action.<br>
Decorative furniture has no icon. The stairs icon changes floor.</p>
<button id="reset">Reset both views</button>
<label>Rotation <select id="rotation"><option>0</option><option>90</option><option>180</option><option>270</option></select>°</label>
<main><section><h2>2D plan</h2><easy-floorplan-card id="flat"></easy-floorplan-card><output id="flat-state"></output></section>
<section><h2>3D view</h2><easy-floorplan-card id="raised"></easy-floorplan-card><output id="raised-state"></output></section></main>
<script type="module">
  import '/src/floorplan-card.ts';
  // HA supplies ha-icon in the dashboard. The standalone fixture uses the same
  // MDI paths (Templarian/MaterialDesign, Apache-2.0) without a network dependency.
  const iconPaths = {"mdi:gesture-tap": "M10,9A1,1 0 0,1 11,8A1,1 0 0,1 12,9V13.47L13.21,13.6L18.15,15.79C18.68,16.03 19,16.56 19,17.14V21.5C18.97,22.32 18.32,22.97 17.5,23H11C10.62,23 10.26,22.85 10,22.57L5.1,18.37L5.84,17.6C6.03,17.39 6.3,17.28 6.58,17.28H6.8L10,19V9M11,5A4,4 0 0,1 15,9C15,10.5 14.2,11.77 13,12.46V11.24C13.61,10.69 14,9.89 14,9A3,3 0 0,0 11,6A3,3 0 0,0 8,9C8,9.89 8.39,10.69 9,11.24V12.46C7.8,11.77 7,10.5 7,9A4,4 0 0,1 11,5Z", "mdi:gesture-tap-hold": "M10,9A1,1 0 0,1 11,8A1,1 0 0,1 12,9V13.47L13.21,13.6L18.15,15.79C18.68,16.03 19,16.56 19,17.14V21.5C18.97,22.32 18.32,22.97 17.5,23H11C10.62,23 10.26,22.85 10,22.57L5.1,18.37L5.84,17.6C6.03,17.39 6.3,17.28 6.58,17.28H6.8L10,19V9M9,12.44V9A2,2 0 0,1 11,7A2,2 0 0,1 13,9V12.44C14.19,11.75 15,10.47 15,9A4,4 0 0,0 11,5A4,4 0 0,0 7,9C7,10.47 7.81,11.75 9,12.44Z", "mdi:gesture-double-tap": "M10,9A1,1 0 0,1 11,8A1,1 0 0,1 12,9V13.47L13.21,13.6L18.15,15.79C18.68,16.03 19,16.56 19,17.14V21.5C18.97,22.32 18.32,22.97 17.5,23H11C10.62,23 10.26,22.85 10,22.57L5.1,18.37L5.84,17.6C6.03,17.39 6.3,17.28 6.58,17.28H6.8L10,19V9M11,5A4,4 0 0,1 15,9C15,10.5 14.2,11.77 13,12.46V11.24C13.61,10.69 14,9.89 14,9A3,3 0 0,0 11,6A3,3 0 0,0 8,9C8,9.89 8.39,10.69 9,11.24V12.46C7.8,11.77 7,10.5 7,9A4,4 0 0,1 11,5M11,3A6,6 0 0,1 17,9C17,10.7 16.29,12.23 15.16,13.33L14.16,12.88C15.28,11.96 16,10.56 16,9A5,5 0 0,0 11,4A5,5 0 0,0 6,9C6,11.05 7.23,12.81 9,13.58V14.66C6.67,13.83 5,11.61 5,9A6,6 0 0,1 11,3Z", "mdi:stairs-up": "M15 6H22V9H18V13H14V17H10V21H3V18H7V14H11V10H15V6M10.17 6.66L4.66 12.17L2.83 10.34L8.34 4.83L6.5 3H12V8.5L10.17 6.66Z", "mdi:stairs-down": "M15 6H22V9H18V13H14V17H10V21H3V18H7V14H11V10H15V6M4.83 8.34L10.34 2.83L12.17 4.66L6.66 10.17L8.5 12H3V6.5L4.83 8.34Z", "mdi:magnify-minus-outline": "M15.5,14H14.71L14.43,13.73C15.41,12.59 16,11.11 16,9.5A6.5,6.5 0 0,0 9.5,3A6.5,6.5 0 0,0 3,9.5A6.5,6.5 0 0,0 9.5,16C11.11,16 12.59,15.41 13.73,14.43L14,14.71V15.5L19,20.5L20.5,19L15.5,14M9.5,14C7,14 5,12 5,9.5C5,7 7,5 9.5,5C12,5 14,7 14,9.5C14,12 12,14 9.5,14M7,9H12V10H7V9Z"};
  customElements.define('ha-icon', class extends HTMLElement {
    static observedAttributes = ['icon'];
    connectedCallback() { this.render(); }
    attributeChangedCallback() { this.render(); }
    render() {
      const root = this.shadowRoot ?? this.attachShadow({mode:'open'});
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.style.cssText = 'display:block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor';
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', iconPaths[this.getAttribute('icon')] ?? iconPaths['mdi:gesture-tap']);
      svg.append(path); root.replaceChildren(svg);
    }
  });
  document.querySelector('#stage').textContent = new URLSearchParams(location.search).get('stage') === 'before' ? '· Before' : '· After';
  const rectangle = (x,y,w,h) => [{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}];
  const empty = {walls:[],openings:[],items:[],texts:[],trackers:[],furniture:[],areas:[]};
  const table = {type:'table',w:150,h:95};
  let seq = 0;
  function render() {
    seq++;
    for (const [id,view] of [['flat','2d'],['raised','3d']]) {
      const previous = document.getElementById(id);
      const card = document.createElement('easy-floorplan-card');
      card.id = id; previous.replaceWith(card);
      card.setConfig({
        type:'custom:easy-floorplan-card',width:640,height:460,wallHeight:60,skin:'pastel',roomFocus:true,
        rotation:Number(document.querySelector('#rotation').value),view,
        floors:[{
          ...empty,id:`${id}-${seq}-ground`,name:'Ground',
          areas:[{id:'room',color:'#b9d9d0',opacity:0.6,zoom:1.3,points:rectangle(70,75,500,335)}],
          furniture:[
            {...table,id:'decorative',x:190,y:175},
            {...table,id:'tap',x:450,y:175,tap_action:{action:'fire-dom-event'}},
            {...table,id:'hold',x:190,y:345,hold_action:{action:'fire-dom-event'}},
            {...table,id:'stairs',type:'stairs',x:450,y:345,goToFloor:'up'}
          ],
          texts:view === '3d' ? [] : [
            {id:'a',x:190,y:105,text:'Decorative',size:14},
            {id:'b',x:450,y:105,text:'Tap action',size:14},
            {id:'c',x:190,y:275,text:'Hold action',size:14},
            {id:'d',x:450,y:275,text:'Go upstairs',size:14}
          ]
        },{
          ...empty,id:`${id}-${seq}-upstairs`,name:'Upstairs',
          areas:[{id:'landing',color:'#b9d9d0',opacity:0.6,points:rectangle(70,75,500,335)}],
          furniture:[{...table,id:'back',type:'stairs',x:320,y:250,goToFloor:'down'}],
          texts:[{id:'e',x:320,y:140,text:'Return downstairs',size:16}]
        }]
      });
      card.hass = {states:{},entities:{}};
      const output = document.getElementById(id+'-state');
      let count = 0;
      const update = async () => {
        await card.updateComplete;
        output.textContent = `${card.shadowRoot.querySelector('.zoom-out') ? 'Room focused' : 'Room not focused'} · Actions fired: ${count}`;
      };
      card.addEventListener('click', update);
      card.addEventListener('ll-custom', () => {count++; update();});
      update();
    }
  }
  document.querySelector('#reset').onclick = render;
  document.querySelector('#rotation').onchange = render;
  render();
</script>
</html>
